[project]
name = "serverless-delivery-ai-assistant"
version = "0.1.0"
description = "Assistente de delivery sem servidor com AWS Step Functions e Amazon Bedrock."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

